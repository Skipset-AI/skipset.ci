AWSTemplateFormatVersion: "2010-09-09"
Description: Skipset CI controller (EC2 + ALB + CodeBuild)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06df7b2ce083f07d5
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-03ee68ede3775fb46
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-063cf09d33dfa3421
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0a5b480feddd9f7c0
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:042470865474:certificate/PLACEHOLDER
  GitHubPATSecretArn:
    Type: String
    Description: Secrets Manager ARN for GitHub PAT (read repos)
  CiHookSecretArn:
    Type: String
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  CiInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: skipset-ci-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      Policies:
        - PolicyName: CiDeployBundle
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref CiHookSecretArn
                  - !Ref GitHubPATSecretArn
                  - arn:aws:secretsmanager:us-east-1:042470865474:secret:skipset/*
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DataImageProject.Arn
              - Effect: Allow
                Action:
                  - ecs:*
                  - ecr:*
                  - cloudformation:*
                  - logs:*
                  - iam:PassRole
                Resource: "*"

  CiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref CiInstanceRole]

  CiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Skipset CI controller
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8765
          ToPort: 8765
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Skipset CI ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  CiALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: skipset-ci
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]

  CiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: skipset-ci-ctrl
      Port: 8765
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /healthz

  CiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref CiALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CiTargetGroup

  CiInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      IamInstanceProfile: !Ref CiInstanceProfile
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref CiSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y git python3.11 python3.11-pip docker jq awscli-2
          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /opt/skipset-ci /var/lib/skipset-ci /var/log/skipset-ci /etc/skipset-ci
          python3.11 -m venv /opt/skipset-ci/venv
          /opt/skipset-ci/venv/bin/pip install -U pip
          curl -fsSL https://bun.sh/install | bash
          echo "SKIPSET_CI_DB=/var/lib/skipset-ci/jobs.sqlite3" > /etc/skipset-ci/env
          echo "SKIPSET_CI_LOG_DIR=/var/log/skipset-ci" >> /etc/skipset-ci/env
          echo "CODEBUILD_PROJECT=skipset-data-image" >> /etc/skipset-ci/env
          echo "AWS_REGION=us-east-1" >> /etc/skipset-ci/env
          # secrets + app filled by deploy script after clone

  DataImageProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: skipset-data-image
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: "042470865474"
          - Name: AWS_DEFAULT_REGION
            Value: us-east-1
          - Name: IMAGE_TAG
            Value: latest
      Source:
        Type: GITHUB
        Location: https://github.com/Skipset-AI/skipset.data.git
        BuildSpec: buildspec.ci.yml
      TimeoutInMinutes: 45

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser

Outputs:
  AlbDnsName:
    Value: !GetAtt CiALB.DNSName
  CiInstanceId:
    Value: !Ref CiInstance
  CodeBuildProject:
    Value: !Ref DataImageProject